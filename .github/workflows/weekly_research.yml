name: Weekly Research & Deploy

on:
  schedule:
    # 매주 월요일 오전 9:17 KST
    - cron: '17 0 * * 1'
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Optional recovery start date (YYYY-MM-DD)'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'gemini_safe_client.py'
      - 'requirements.txt'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1: 주간 논문 수집 & AI 분석 ──
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test weekly pipeline
      run: python -m unittest discover -s tests -v
        
    - name: Run research scripts
      env:
        FROM_DATE: ${{ inputs.from_date }}
      run: |
        python scripts/fetch_latest_papers.py

    - name: Generate weekly JSON data & search index
      run: |
        python scripts/convert_all_to_weekly.py
        python scripts/generate_search_index.py

    - name: Analyze pending marketing papers
      id: analysis
      continue-on-error: true
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        MAX_ANALYSES: '40'
      run: python scripts/analyze_pending.py

    - name: Report incomplete AI analysis
      if: steps.analysis.outcome == 'failure'
      run: |
        echo "::warning::AI analysis is incomplete. Check the analysis step, GEMINI_API_KEY and quota. Saved papers will retry next run."
        echo "AI analysis incomplete; metadata and successful summaries will still be published. See the analysis step for the error." >> "$GITHUB_STEP_SUMMARY"

    - name: Commit updated data
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add site/public/data/
        if ! git diff --staged --quiet; then
          git commit -m "📊 Weekly data update $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
        fi

  # ── Job 2: 사이트 빌드 & 배포 ──
  deploy:
    runs-on: ubuntu-latest
    # research 작업이 실행되었다면 성공해야 하고, 실행되지 않았다면(skip) 그냥 진행합니다.
    needs: [research]
    if: always() && !contains(needs.research.result, 'failure') && !contains(needs.research.result, 'cancelled')
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: site/package-lock.json

    - name: Install dependencies
      working-directory: site
      run: npm ci

    - name: Generate search index
      run: |
        echo "Verifying data directory..."
        ls -R site/public/data/ || echo "Data directory not found!"
        python scripts/generate_search_index.py

    - name: Build Next.js static site
      working-directory: site
      env:
        NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
      run: |
        npm run build
        touch out/.nojekyll

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site/out

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
